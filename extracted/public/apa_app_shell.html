<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credentialing Workspace</title>
<link rel="icon" type="image/jpeg" href="/logo2.jpg">
<link rel="apple-touch-icon" href="/logo2.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Committed single-theme design: a dark console. Every colour is painted
   explicitly so the page holds on any host background. */
:root{
  color-scheme: dark;
  --ground:#080E0D; --surface:#101917; --surface-2:#17231F; --surface-3:#1D2C27;
  --ink:#EAF2EF; --ink-2:#B9CBC5; --muted:#7F958E; --line:#25332E;
  --accent:#3FD3A8; --accent-soft:#0F2E26; --accent-ink:#9DEBD2;
  /* UI text colours: light enough to read on the dark tinted pill grounds */
  --ch-email:#3FD3A8; --ch-email-bg:#0F2E26;
  --ch-form:#E3AE4C;  --ch-form-bg:#332711;
  --ch-phone:#7CB2E0; --ch-phone-bg:#14283A;
  --ch-none:#E89078;  --ch-none-bg:#3A1E16;
  /* CHART MARK colours: a different job, so validated separately against the
     chart surface (#101917). All 6 pairs pass normal-vision, protan and deutan
     separation — computed with validate_palette.py, not eyeballed. */
  --m-email:#44A56D; --m-form:#BB7E00; --m-phone:#0060D4; --m-none:#9B4D5B;
  --m-seq:#3FD3A8;
  --shadow:0 1px 2px rgba(0,0,0,.55),0 10px 28px -14px rgba(0,0,0,.8);
  --shadow-lift:0 2px 10px rgba(0,0,0,.6),0 26px 52px -22px rgba(0,0,0,.95);
  --r:14px; --maxw:1320px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="light"]{
  color-scheme:light;
  --ground:#F4F8F6; --surface:#FFFFFF; --surface-2:#E8F0ED; --surface-3:#DCE8E3;
  --ink:#14211D; --ink-2:#355149; --muted:#607870; --line:#C8D8D1;
  --accent:#087F63; --accent-soft:#D9F2E9; --accent-ink:#075A47;
  --ch-email:#087F63; --ch-email-bg:#D9F2E9; --ch-form:#936600; --ch-form-bg:#FFF1C9;
  --ch-phone:#1765A0; --ch-phone-bg:#DCEEFF; --ch-none:#A9442E; --ch-none-bg:#FFE2D9;
  --shadow:0 1px 2px rgba(20,33,29,.12),0 10px 28px -14px rgba(20,33,29,.25);
}
[data-theme="contrast"]{
  color-scheme:dark;
  --ground:#000; --surface:#0B0B0B; --surface-2:#171717; --surface-3:#242424;
  --ink:#FFF; --ink-2:#FFF; --muted:#D6D6D6; --line:#777;
  --accent:#57FFD0; --accent-soft:#123F35; --accent-ink:#B8FFE9;
  --ch-email:#57FFD0; --ch-email-bg:#123F35; --ch-form:#FFD34F; --ch-form-bg:#4A3B00;
  --ch-phone:#8DC7FF; --ch-phone-bg:#12365A; --ch-none:#FF9F8A; --ch-none-bg:#4A2118;
}
[data-theme="ocean"]{
  color-scheme:dark;
  --ground:#07131D; --surface:#0D202D; --surface-2:#123346; --surface-3:#19455C;
  --ink:#E8F7FF; --ink-2:#BBD9E8; --muted:#80A7BA; --line:#24546A;
  --accent:#45D6F5; --accent-soft:#103D50; --accent-ink:#B7F3FF;
  --ch-email:#45D6F5; --ch-email-bg:#103D50; --ch-form:#F3C969; --ch-form-bg:#493B1B;
  --ch-phone:#91BFFF; --ch-phone-bg:#183B61; --ch-none:#FF9D9D; --ch-none-bg:#4B222B;
}
[data-theme="slate"]{
  color-scheme:dark;
  --ground:#111318; --surface:#1A1D24; --surface-2:#252A34; --surface-3:#303744;
  --ink:#F0F2F5; --ink-2:#C8CFD8; --muted:#929BA8; --line:#3D4654;
  --accent:#A9B8FF; --accent-soft:#292F52; --accent-ink:#D8DEFF;
  --ch-email:#A9B8FF; --ch-email-bg:#292F52; --ch-form:#F2C879; --ch-form-bg:#4B3E23;
  --ch-phone:#8FD3FF; --ch-phone-bg:#1E3B52; --ch-none:#FF9FBA; --ch-none-bg:#4B2633;
}
[data-theme="sand"]{
  color-scheme:light;
  --ground:#F5F0E8; --surface:#FFFDF8; --surface-2:#EEE5D7; --surface-3:#E4D8C7;
  --ink:#2D2924; --ink-2:#584E43; --muted:#817467; --line:#D5C6B2;
  --accent:#9A5B35; --accent-soft:#F3E0D1; --accent-ink:#713D20;
  --ch-email:#287A60; --ch-email-bg:#DDF1E8; --ch-form:#9A6816; --ch-form-bg:#FBEAC1;
  --ch-phone:#3C6D9C; --ch-phone-bg:#DFEBF7; --ch-none:#A84B3A; --ch-none-bg:#F8DDD6;
}
*{box-sizing:border-box}
[hidden]{display:none!important} /* .grid/.tiles/.controls set their own display:
  this guarantees hidden always wins, regardless of what else targets the element */
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin:0 auto; padding-inline:18px}

/* ---------- header ---------- */
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  /* Near-opaque instead of backdrop-filter: a blurred sticky header re-rasterises
     every scroll frame over the card grid, which was the main scroll jank. */
  background:color-mix(in srgb,var(--ground) 97%,transparent);
  border-bottom:1px solid var(--line);
  contain:layout paint;
}
.top-in{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{
  width:220px;height:70px;border-radius:0;flex:none;position:relative;
  background:url("logo2.jpg") center/contain no-repeat;
  display:block;
}
.bname{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;letter-spacing:-.025em;line-height:1.15}
.bsub{font-size:11.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.spacer{flex:1 1 auto}
.iconbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;
  transition:.18s var(--ease);
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.themeSelect{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:10px;padding:8px 30px 8px 10px;font:inherit;font-size:12px}
.provName{display:inline-flex;align-items:center;gap:9px}
.provAvatar{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;background:var(--surface-3);border:1px solid var(--line)}
.provAvatar.placeholder{display:inline-grid;place-items:center;color:var(--muted);font-size:13px}
.photoPreview{display:block;width:96px;height:96px;border-radius:12px;object-fit:cover;margin-top:8px;border:1px solid var(--line)}

/* ---------- hero strip ---------- */
.lede{padding-block:22px 6px}
.lede h1{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(26px,4.4vw,40px);letter-spacing:-.035em;line-height:1.04;
  margin:0 0 8px;text-wrap:balance;
}
.lede p{margin:0;color:var(--ink-2);max-width:62ch;font-size:15px}
.lede b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;padding-block:20px}
.tile{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px 14px;transition:.22s var(--ease);box-shadow:var(--shadow);
  font-family:inherit;color:inherit;
}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--tc,var(--accent)) 55%,var(--line))}
.tile[aria-pressed="true"]{border-color:var(--tc,var(--accent));background:var(--tbg,var(--accent-soft))}
.tile .stripe{position:absolute;inset:0 auto 0 0;width:3px;background:var(--tc,var(--accent));opacity:.5;transition:.22s var(--ease)}
.tile[aria-pressed="true"] .stripe,.tile:hover .stripe{opacity:1;width:4px}
.tnum{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--tc,var(--accent));display:block}
.tlab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin-top:7px}
.thint{font-size:12px;color:var(--muted);margin-top:3px}

/* ---------- controls ---------- */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-bottom:16px}
.search{position:relative;flex:1 1 280px;min-width:0}
.search input{
  width:100%;padding:11px 14px 11px 38px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:14.5px;transition:.18s var(--ease);
}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
select.sel{
  padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font:inherit;font-size:14px;cursor:pointer;max-width:100%;
}
select.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- progress ---------- */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.prog-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.prog-t{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.prog-n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .7s var(--ease)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:99px;flex:none}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px;padding-bottom:40px}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:0;margin-left:auto}
.pager .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.pager-label{min-width:130px;text-align:center;color:var(--muted);font-size:12px}
.card{
  contain:layout paint style;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:9px;text-align:left;font:inherit;color:inherit;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);
  box-shadow:var(--shadow);content-visibility:auto;contain-intrinsic-size:auto 168px;
  animation:pop .42s var(--ease) both;
}
/* GSAP drives entrance when it loads; this keyframe is the no-JS-library fallback */
.gsap-on .card{animation:none}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .edge{position:absolute;inset:0 auto 0 0;width:3px;background:var(--cc);transition:width .2s var(--ease)}
.card:hover .edge{width:5px}
.cname{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15.5px;letter-spacing:-.018em;line-height:1.25;padding-left:4px}
.ctype{font-size:12.5px;color:var(--muted);padding-left:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding-left:4px;margin-top:auto}
.pill{
  font-size:11px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;
}
.pill.ch{background:var(--ccbg);color:var(--cc)}
.pill.st{border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.contact{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;color:var(--ink-2);
  padding-left:4px;word-break:break-all;line-height:1.45;
}
.contact b{color:var(--accent);font-weight:600}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,12,.58);z-index:60;opacity:0;transition:opacity .28s var(--ease)}
.scrim.on{opacity:1}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:61;
  background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .34s var(--ease);box-shadow:-24px 0 60px -30px rgba(0,0,0,.5);
  will-change:transform;contain:layout paint;
}
.drawer.on{transform:none}
.dhead{padding:20px 22px 16px;border-top:4px solid var(--cc,var(--accent));border-bottom:1px solid var(--line)}
.dname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.028em;line-height:1.16;margin:0 0 7px;text-wrap:balance}
.dmeta{font-size:13px;color:var(--muted)}
.dbody{padding:18px 22px 34px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:17px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.flab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fval{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13.5px;word-break:break-word;line-height:1.55}
.fval a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.fval a:hover{border-bottom-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  padding:8px 13px;border-radius:9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:.18s var(--ease);display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04211A;font-weight:700}
.btn.pri:hover{filter:brightness(1.12);color:#04211A}
.btn.sm{padding:5px 10px;font-size:12px}
.statuses{display:flex;gap:7px;flex-wrap:wrap}
.sbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:7px 12px;border-radius:99px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:.18s var(--ease);
}
.sbtn:hover{transform:translateY(-1px);border-color:var(--sc)}
.sbtn[aria-pressed="true"]{background:var(--sc);border-color:var(--sc);color:#08100E;font-weight:700}
.note{width:100%;min-height:74px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--ground);color:var(--ink);font:inherit;font-size:13.5px;resize:vertical}
.note:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.src{font-size:12px;color:var(--muted);line-height:1.5;border-left:2px solid var(--line);padding-left:11px}
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;color:var(--ink);margin-bottom:6px;font-weight:700}
.dueBar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:12px 0 0;padding:10px 14px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ch-form);box-shadow:var(--shadow);font-size:13px;color:var(--ink)}
.dueBar svg{color:var(--ch-form);flex:none}
.dueBar .over{color:var(--ch-none);font-weight:600}
.dueChip{border:1px solid var(--line);background:var(--ground);color:var(--ink);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:99px;
  cursor:pointer;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dueChip:hover{border-color:var(--accent)}
.dueChip.over{border-color:var(--ch-none)}
#dueShow{margin-left:auto}
.dueBar.calm{border-left-color:var(--line);box-shadow:none;color:var(--muted)}
.dueBar.calm svg{color:var(--muted)}
.rowHead{margin:18px 0 -4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rowHead b{color:var(--ink-2);font-weight:700}
/* ---------- Hiring + Tasks tabs ---------- */
.hhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:18px 0 12px}
.hhead h2{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.subnav button{font-size:13px;padding:6px 14px}
.hdash{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin:14px 0}
.hctl{margin:10px 0}
.hpill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;color:var(--pc);border:1px solid var(--pc);white-space:nowrap}
.pbar{display:inline-block;width:70px;height:7px;border-radius:99px;background:var(--surface-2);vertical-align:middle;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ch-email);border-radius:99px}
#hiringView tr[data-cand],#hiringView tr[data-book],#tasksView tr[data-task]{cursor:pointer}
#hiringView tr[data-cand]:hover td,#hiringView tr[data-book]:hover td,#tasksView tr[data-task]:hover td{background:var(--surface-2)}
tr.past td{opacity:.55}
.modal.wide{width:min(900px,94vw);max-width:none}
.hform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.hsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;max-height:42vh;overflow:auto;padding:2px}
.hstep{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--ground)}
.hstep input{margin-top:3px}
.hstep b{display:block;font-size:13px;font-weight:600}
.hstep em{font-style:normal;font-size:11.5px;color:var(--muted)}
.hstep:has(input:checked){border-color:var(--ch-email)}
.wkgrid{display:grid;grid-template-columns:70px repeat(4,1fr);gap:6px}
.wkh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:2px 4px}
.wkl{font-size:12px;color:var(--muted);align-self:center}
.wkc{border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:64px;display:flex;flex-direction:column;gap:4px;background:var(--ground)}
.wkc em{font-style:normal;font-size:11px;color:var(--muted)}
.wkc.today{border-color:var(--accent)}
.wkc.past{opacity:.5}
.bk{font-size:11.5px;padding:3px 7px;border-radius:7px;background:var(--accent-soft);color:var(--ink)}
.bk.tr{background:var(--ch-form-bg)}
.free{font-size:11.5px;color:var(--muted)}
@media (max-width:760px){.wkgrid{grid-template-columns:48px repeat(4,1fr)}.hdash .dcard{grid-column:1/-1}}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:80;
  background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:99px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.26s var(--ease);
  box-shadow:var(--shadow-lift);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sync{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:99px;background:var(--muted);display:block}
.sync.live i{background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* ---------- view switch ---------- */
.tabs{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:4px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13.5px;flex:none;
  font-weight:700;padding:7px 15px;border-radius:8px;cursor:pointer;transition:.2s var(--ease)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:#04211A}

/* ---------- notifications, modal, forms (credentialing-app additions) ---------- */
.bellwrap{position:relative}
.badge{position:absolute;top:-4px;right:-4px;background:var(--ch-none);color:#2A0E08;font-size:10px;
  font-weight:800;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px}
.nlist{position:absolute;right:0;top:44px;width:340px;max-height:420px;overflow:auto;z-index:70;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lift);padding:8px}
.nitem{padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:var(--accent-soft)}
.nitem b{display:block;font-size:13px}
.nitem span{color:var(--muted);font-size:11.5px}
.modalScrim{position:fixed;inset:0;background:rgba(6,14,12,.6);z-index:90;display:grid;place-items:center;padding:20px}

/* ---------- login screen ---------- */
.loginScrim{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:var(--ground);overflow:hidden}
.loginBlob{position:fixed;width:340px;height:340px;border-radius:999px;filter:blur(70px);opacity:.35;z-index:0;
  animation:loginFloat 11s ease-in-out infinite alternate}
.loginBlob.b1{background:var(--accent);top:-100px;left:-80px}
.loginBlob.b2{background:var(--ch-phone);bottom:-110px;right:-80px}
@keyframes loginFloat{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(18px,-22px,0) scale(1.06)}}
.loginCard{position:relative;z-index:1;width:100%;max-width:380px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lift);
  padding:30px 26px 26px;backdrop-filter:blur(18px);animation:loginCardIn .5s var(--ease) both}
@keyframes loginCardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.loginCard h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;
  letter-spacing:-.02em;text-align:center;margin:0}
.loginSub{margin:6px 0 22px;font-size:13px;color:var(--muted);text-align:center}
.loginField{margin-bottom:14px}
.loginFieldInner{display:flex;align-items:center;gap:8px;background:var(--ground);
  border:1px solid var(--line);border-radius:10px;padding:0 12px;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),transform .15s var(--ease)}
.loginFieldInner svg{color:var(--muted);flex:none}
.loginFieldInner:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:translateY(-1px)}
.loginFieldInner input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);
  font:inherit;font-size:14px;padding:11px 2px}
.loginTogglePw{border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;
  padding:4px;transition:color .15s var(--ease)}
.loginTogglePw:hover{color:var(--accent)}
.loginErrRow{margin:-4px 0 10px}
.loginErrRow .err{animation:loginShake .3s var(--ease)}
@keyframes loginShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.loginSubmitBtn{width:100%;justify-content:center;margin-top:6px;padding:12px;font-size:14.5px}
.loginCard{max-height:calc(100vh - 40px);overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-width:560px;width:100%;
  max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow-lift)}
.modal h3{font-family:"Bricolage Grotesque",sans-serif;margin:0 0 14px}
.frow{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.frow label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.frow label.req::after{content:' *';color:var(--ch-none)}
.frow input,.frow select,.frow textarea{padding:9px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--ground);color:var(--ink);font:inherit;font-size:13.5px}
.frow input:focus,.frow select:focus,.frow textarea:focus{outline:none;border-color:var(--accent)}
.frow .err{color:var(--ch-none);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:99px;padding:4px 9px;font-size:12px;margin:2px 4px 2px 0}
.tag button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.notesLog{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto}
.noteItem{background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.noteItem .who{color:var(--muted);font-size:11px;margin-top:3px}
.attItem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.tblwrap{overflow:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th,table.dt td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
table.dt th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.calendar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.calendar-title{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700}
.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calendar-weekdays{background:var(--surface-2);border-bottom:1px solid var(--line)}
.calendar-weekdays div{padding:9px 10px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.calendar-day{min-height:130px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.calendar-day:nth-child(7n){border-right:0}
.calendar-day.muted{background:var(--ground);color:var(--muted)}
.calendar-day.today{box-shadow:inset 0 3px 0 var(--accent)}
.calendar-date{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.calendar-day.today .calendar-date{color:var(--accent)}
.training-event{display:block;width:100%;margin:3px 0;padding:6px 7px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);text-align:left;font:inherit;font-size:11.5px;line-height:1.25;cursor:pointer}
.training-event:hover{border-color:var(--accent);transform:translateY(-1px)}
.training-event b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.training-event span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.calendar-day{min-height:92px;padding:5px}.calendar-weekdays div{padding:7px 4px;font-size:9px}.training-event{font-size:10px;padding:4px}.training-event span{display:none}}

/* ---------- people to contact (drawer) ---------- */
.plist{display:flex;flex-direction:column;gap:7px}
.pitem{display:flex;flex-direction:column;gap:2px;background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.pitem b{font-weight:700}
.pitem .ptitle{color:var(--muted);font-size:12px}
.pitem a{color:var(--accent);text-decoration:none;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;word-break:break-all}
.pitem a.plink{font-family:inherit;font-size:11.5px}

/* ---------- login rain ---------- */
.loginRain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;padding:18px 0 44px}
.dkpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.dkpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dkpi .stripe{position:absolute;inset:0 auto 0 0;width:3px;background:var(--tc,var(--accent));opacity:.8}
.dkpi .tnum{color:var(--tc,var(--accent))}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);
  grid-column:span 6;min-width:0;contain:layout paint}
.dcard.w4{grid-column:span 4}.dcard.w8{grid-column:span 8}.dcard.w12{grid-column:1/-1}
.dcard h3{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
.dcard .dsub{font-size:12px;color:var(--muted);margin:0 0 12px}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:4px 11px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
table.team td.n{text-align:right;font-variant-numeric:tabular-nums}
table.team th.n{text-align:right}
.ctsum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.ctsum span{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}
.ctsum b{color:var(--ink)}
.ctpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:2px 0 10px;font-size:13px}.ctpick label{font-weight:600}
.ctpick input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin-left:6px;color-scheme:light dark}
.ctlist{max-height:260px;overflow:auto;margin-bottom:12px}table.team tr[data-ctd]{cursor:pointer}table.team tr.on td{background:var(--accent-soft)}.ctsum .lbl{border:0;padding-left:0;font-weight:600}
table.team td.idle{color:var(--ch-none)}
table.team .mini{display:inline-block;vertical-align:middle;height:6px;border-radius:99px;background:var(--m-form);margin-right:6px}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(90px,36%) 1fr 84px;align-items:center;gap:10px;font-size:12.5px;cursor:default;
  border:0;background:none;color:inherit;font:inherit;text-align:left;padding:2px 0;border-radius:6px}
button.hbar{cursor:pointer}
button.hbar:hover .hlab{color:var(--accent)}
.hlab{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.htrack{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.htrack i{display:block;height:100%;border-radius:99px;width:0;transition:width .8s var(--ease)}
.hval{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12px;white-space:nowrap}
.donutWrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donutWrap svg{flex:none}
.donutLegend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;min-width:0;flex:1}
.donutLegend button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink-2);font:inherit;cursor:pointer;padding:2px 0;text-align:left}
.donutLegend button:hover{color:var(--accent)}
.donutLegend b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.donut circle{transition:stroke-dasharray .9s var(--ease)}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%;justify-content:flex-end}
.col i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--m-seq);height:0;transition:height .8s var(--ease)}
.col span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.col em{font-style:normal;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dlist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.dlist button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--ground);color:var(--ink);
  border-radius:9px;padding:8px 10px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.dlist button:hover{border-color:var(--accent)}
.dlist .due{color:var(--muted);white-space:nowrap}
.dlist .over{color:var(--ch-none)}
@media (max-width:900px){.dcard,.dcard.w4,.dcard.w8{grid-column:1/-1}}

@media (max-width:560px){
  .lede h1{font-size:25px} .drawer{width:100%} .tnum{font-size:26px} .nlist{width:calc(100vw - 36px);right:-8px}
  .wrap{padding-inline:12px}
  .mark{width:150px;height:48px}
  .bname{font-size:14px}
  .bsub{font-size:10px}
  .top-in{gap:10px;padding-block:10px}
  .sync{display:none}
  .modal{padding:16px}
  .loginCard{padding:24px 18px 20px}
  .tblwrap{-webkit-overflow-scrolling:touch}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
#signoffView{padding:4px 0 30px;}
.so-head{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between; margin:6px 0 16px;}
.so-head h2{margin:0; font-size:20px;}
.so-sub{font-size:13px; color:var(--muted); font-weight:500; margin-left:6px;}
.so-dl{color:var(--ink-2); font-size:13px; margin-top:4px;}
.so-today{color:var(--accent);} .so-ro{color:var(--ch-form);}
.so-ctl{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.so-ctl input[type=date]{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:6px 9px; font:inherit; color-scheme:dark light;}
.so-chk{display:flex; gap:6px; align-items:center; font-size:13px; color:var(--ink-2); cursor:pointer;}
.so-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; align-items:start;}
.so-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow);}
.so-ch{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
.so-av{position:relative; width:42px; height:42px; border-radius:11px; display:grid; place-items:center; font-weight:700; font-size:15px; flex-shrink:0;
  background:color-mix(in srgb, var(--av) 18%, transparent); color:var(--av);}
.so-av::after{content:''; position:absolute; right:-2px; bottom:-2px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--surface);}
.so-who{flex:1; min-width:0;} .so-who b{display:block; font-size:15.5px;} .so-who span{font-size:12.5px; color:var(--muted);}
.so-total{font-size:12.5px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:5px 10px; border-radius:9px; white-space:nowrap;}
.so-tile{display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-top:8px;
  color:var(--ink); font:inherit; cursor:pointer; transition:border-color .15s, transform .15s;}
.so-tile:hover{border-color:var(--accent); transform:translateY(-1px);}
.so-tile.empty{padding:8px 12px;} .so-tile.empty b{color:var(--ink-2); font-weight:500;}
.so-tt{display:flex; align-items:center; gap:8px;}
.so-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0;} .so-tile.empty .so-dot{background:var(--muted);}
.so-tt b{flex:1; font-size:13.5px; font-weight:600;}
.so-n{min-width:24px; height:24px; padding:0 5px; border-radius:7px; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--accent-soft); color:var(--accent-ink);}
.so-tile.empty .so-n{background:transparent; color:var(--muted);}
.so-plus{width:24px; height:24px; border-radius:7px; border:1px solid var(--line); display:grid; place-items:center; color:var(--ink-2); font-size:15px;}
.so-prev{font-size:12.5px; color:var(--ink-2); margin:6px 0 0 15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.so-more{font-size:12px; color:var(--accent); font-weight:600; margin:4px 0 0 15px;}
.so-plus{transition:transform .2s;} .so-tile.open{border-color:var(--accent);} .so-tile.open .so-plus{transform:rotate(90deg); color:var(--accent); border-color:var(--accent);}
.so-drop{margin:9px 0 2px 15px; padding-top:9px; border-top:1px solid var(--line); animation:soDrop .18s ease both; cursor:default;}
.so-drop ol{margin:0; padding-left:18px; font-size:13px; line-height:1.65; color:var(--ink);} .so-drop .so-none{padding:2px 0;} .so-edit{margin-top:9px;}
.so-c{font-size:11.5px; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent); border-radius:7px; padding:2px 7px; white-space:nowrap;}
.so-qa{display:flex; justify-content:space-between; gap:10px; align-items:center; background:var(--surface-3); border-radius:8px; padding:7px 10px; margin-bottom:8px; font-size:12.5px; color:var(--ink-2);}
.so-qa b{font-size:16px; color:var(--accent);}
.so-nt{white-space:pre-wrap; overflow-wrap:anywhere;} .so-drop li{margin-bottom:5px;} .so-drop li .so-hint{margin-top:1px;}
.so-sub2{font-weight:700; font-size:13px; margin:4px 0 6px;}
.so-notes{display:flex; flex-direction:column; gap:6px; max-height:38vh; overflow:auto; margin-bottom:10px;}
.so-note{background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:13.5px;}
.so-nm{display:flex; gap:10px; align-items:center; margin-top:4px; font-size:11.5px; color:var(--muted);} .so-nm span{flex:1;}
.lnk{background:none; border:0; color:var(--accent); font:inherit; font-size:12px; cursor:pointer; padding:0;}
.so-na{display:flex; gap:6px; margin-top:6px;}
.so-ta, .so-in, #soCount{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:8px 10px; font:inherit;}
textarea.so-ta{min-height:76px; resize:vertical;} #soCount{max-width:160px; font-size:16px; font-weight:700;}
.so-ty small{display:block; color:var(--muted); font-size:11.5px;}
.sd-mode{margin:0;} .sd-mode button{padding:5px 12px;}
.so-ctl input[type=month]{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:6px 9px; font:inherit; color-scheme:dark light;}
.sd-wrap{overflow-x:auto; padding:12px;} .sd-t td:first-child{font-weight:600; white-space:nowrap;} .sd-t th{text-align:center;} .sd-t th:first-child{text-align:left;}
.sd-dash{color:var(--muted);} .sd-tot td{font-weight:700; border-top:2px solid var(--line);}
.sd-bars{display:flex; align-items:flex-end; gap:3px; height:170px; padding:14px 12px 10px;}
.sd-bar{flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:3px;}
.sd-bar i{display:block; width:100%; max-width:22px; min-height:2px; background:var(--accent); border-radius:4px 4px 0 0;}
.sd-bar b{font-size:10px; color:var(--ink-2);} .sd-bar span{font-size:10px; color:var(--muted);} .sd-bar.fut i{background:var(--line);}
@keyframes soDrop{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}
.so-mm{color:var(--muted); font-size:13px; margin:-4px 0 12px;}
.so-hint{color:var(--muted); font-size:12px; margin-top:6px;}
.so-list{margin:6px 0 4px; padding-left:22px; line-height:1.65;}
.so-none{color:var(--muted); font-size:13px; padding:10px 2px;}
.so-empty{color:var(--muted); padding:30px; text-align:center;}
.so-report{white-space:pre-wrap; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px; max-height:55vh; overflow:auto; font-size:12.5px; line-height:1.5;}
.so-types{display:flex; flex-direction:column; gap:6px; margin:4px 0 12px;}
.so-ty{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:7px 10px; font-size:13.5px;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
"use strict";
var savedTheme=localStorage.getItem('credentialing-theme')||'standard';
if(['standard','light','contrast','ocean','slate','sand'].indexOf(savedTheme)<0) savedTheme='standard';
document.documentElement.setAttribute('data-theme',savedTheme);
var themeSelect=document.getElementById('themeSelect');
themeSelect.value=savedTheme;
themeSelect.addEventListener('change',function(){
  document.documentElement.setAttribute('data-theme',this.value);
  localStorage.setItem('credentialing-theme',this.value);
});
var G = window.gsap || null;
var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(G && !REDUCED){ document.documentElement.classList.add('gsap-on'); }
var ORGS = [], PROVIDERS = [], NOTIFS = [], AUDIT = [], ACCEPTED_INSURANCES = {}, TRAINING = [], USERS = [], HIRING = [], TASKS = [];
var ME = null; /* signed-in user, from /.auth/me (SWA) */

function api(path, opts){
  opts = opts || {};
  return fetch(path, opts).then(function(r){
    if(!r.ok) return r.json().catch(function(){return {};}).then(function(b){
      var err=new Error(b.error||('HTTP '+r.status)); err.status=r.status; err.body=b; throw err;
    });
    var ct = r.headers.get('content-type')||'';
    return ct.indexOf('json')>=0 ? r.json() : r.text();
  });
}
function apiGet(entity){ return api('/api/data/'+entity); }
/* The ~900 KB spreadsheet library is only needed for Export, so it is fetched
   on first use instead of blocking every page load. */
var xlsxPromise=null;
function withXLSX(fn){
  if(window.XLSX) return fn(window.XLSX);
  if(!xlsxPromise){
    toast('Preparing export…');
    xlsxPromise=new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=function(){resolve(window.XLSX);}; s.onerror=function(){xlsxPromise=null;reject(new Error('Could not load the export library'));};
      document.head.appendChild(s);
    });
  }
  xlsxPromise.then(fn).catch(function(e){toast(e.message);});
}
var SAVING={};   /* identical saves still in flight -- a double-click must not save (and log) twice */
function apiSave(entity, record, action){
  var body=JSON.stringify({record:record, action:action}), key=entity+'|'+body;
  if(SAVING[key]) return new Promise(function(){});   /* the first request finishes the job */
  if(entity==='leads' && action!=='create' && record && record.i!=null){   /* lets the audit name the lead and show old -> new */
    var o0=ORGS.filter(function(x){return String(x.i)===String(record.i);})[0];
    if(o0){ var bf={}; Object.keys(record).forEach(function(k){ if(k!=='i' && (o0[k]==null || typeof o0[k]!=='object')) bf[k]=o0[k]; });
      body=JSON.stringify({record:Object.assign({},record,{_n:o0.n,_before:bf}), action:action}); }
  }
  var p=api('/api/data/'+entity, {method:'POST', headers:{'Content-Type':'application/json'}, body: body});
  SAVING[key]=p; var done=function(){ delete SAVING[key]; }; p.then(done,done);
  return p;
}

var CH = {
  email:{lab:'Email',    c:'var(--ch-email)', bg:'var(--ch-email-bg)'},
  form: {lab:'Apply online', c:'var(--ch-form)',  bg:'var(--ch-form-bg)'},
  phone:{lab:'Phone',    c:'var(--ch-phone)', bg:'var(--ch-phone-bg)'},
  none: {lab:'No contact', c:'var(--ch-none)',  bg:'var(--ch-none-bg)'}
};
var STATUS = [
  {k:'new',       lab:'Not started', c:'var(--muted)'},
  {k:'contacted', lab:'Emailed',     c:'var(--ch-phone)'},
  {k:'applied',   lab:'Applied',     c:'var(--ch-form)'},
  {k:'talking',   lab:'In progress', c:'#7A5AA8'},
  {k:'contracted',lab:'Contracted',  c:'var(--ch-email)'},
  {k:'covered',   lab:'Already covered', c:'#6E7C8A'},
  {k:'declined',  lab:'Declined',    c:'var(--ch-none)'},
  {k:'invalid',   lab:'Invalid',     c:'#B4233C'}
];
var SMAP={}; STATUS.forEach(function(s){SMAP[s.k]=s;});

/* Statuses carried in from the team's tracking workbook (16-17 Sep 2026).
   A later edit made in this page wins over the imported value. */
var SEEDED=0;
ORGS.forEach(function(o){
  if(o.st){ SEEDED++; }
});

var PAGE_SIZE = 60;
var PROVIDER_PAGE_SIZE = 25;
var state = {q:'', type:'', chan:'', stat:'', grp:'', page:1, providerPage:1, statsDirty:true, filtered:[]};
var undoDelete = null;

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(msg){
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('on');},1900);
}
function copy(text,label){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast(label+' copied');},
      function(){toast('Could not copy');});
  } else { toast('Could not copy'); }
}
function statOf(o){ return o.st || 'new'; }
function statSrc(o){ return o.st? (o.sa||'')+(o.sd?' · '+o.sd:'') : ''; }
function indexOrg(o){
  o._search=(o.n+' '+o.t+' '+o.em+' '+o.ad+' '+o.chan+' '+o.ph+' '+(o.fx||'')+' '+o.w+' '+(o.note||' ')+' '+(o.notesLog||[]).map(function(n){return n.text||'';}).join(' ')+
    ' '+(o.people||[]).map(function(p){return (p.name||'')+' '+(p.title||'')+' '+(p.email||'');}).join(' ')).toLowerCase();
  o._gk=computeGroupKey(o);   /* cached: groupKey ran a regex per org on every filter pass */
  state.sorted=false;
  return o;
}
/* Sort once per data change (not on every keystroke/filter): channel order, then name. */
var COLL=(window.Intl&&Intl.Collator)?new Intl.Collator(undefined,{sensitivity:'base',numeric:true}):null;
function sortOrgs(){
  ORGS.sort(function(a,b){
    var d=ORDER[a.ch]-ORDER[b.ch]; if(d) return d;
    return COLL?COLL.compare(a.n||'',b.n||''):String(a.n).localeCompare(String(b.n));
  });
  state.sorted=true;
}

/* ---------- tiles ---------- */
/* "How to reach them" counts follow the group tile that is selected (Leads to contact, Already contacted, ...),
   so the numbers under a group always add up to that group instead of mixing in the whole directory. */
/* Fax is not a "best channel" -- a lead can have email AND fax -- so its tile counts every lead with a fax number
   and filters on that on its own (state.fax), alongside the channel tiles. */
function countBy(k){ var n=0; for(var i=0;i<ORGS.length;i++){ var o=ORGS[i]; if((k==='fax'? !!o.fx : o.ch===k) && (!state.grp || groupKey(o)===state.grp)) n++; } return n; }
var TILEDEF=[
  {k:'email', lab:'Email',         hint:'send directly',        c:'var(--ch-email)',  bg:'var(--ch-email-bg)'},
  {k:'form',  lab:'Apply online',  hint:'join-network form',    c:'var(--ch-form)',   bg:'var(--ch-form-bg)'},
  {k:'phone', lab:'Phone',         hint:'call to get contact',  c:'var(--ch-phone)',  bg:'var(--ch-phone-bg)'},
  {k:'none',  lab:'No contact',    hint:'needs research',       c:'var(--ch-none)',   bg:'var(--ch-none-bg)'},
  {k:'fax',   lab:'Fax',           hint:'has a fax number',     c:'#9B7FD1',          bg:'var(--accent-soft)'}
];
function buildTiles(){
  var host=document.getElementById('tiles'); host.innerHTML='';
  TILEDEF.forEach(function(d,idx){
    var n = countBy(d.k);
    var b=document.createElement('button');
    b.className='tile'; b.type='button';
    b.style.setProperty('--tc',d.c); b.style.setProperty('--tbg',d.bg);
    b.setAttribute('aria-pressed', String(d.k==='fax'? !!state.fax : state.chan===d.k));
    b.innerHTML='<i class="stripe"></i><span class="tnum" data-n="'+n+'">0</span>'+
      '<div class="tlab">'+esc(d.lab)+'</div><div class="thint">'+esc(d.hint)+'</div>';
    b.addEventListener('click',function(){
      // Narrows the group that is selected (e.g. Leads to contact + Email); click again to clear.
      if(d.k==='fax'){ state.fax=!state.fax; dueOnly=false; state.page=1; syncTiles(); render(); return; }
      state.chan = (state.chan===d.k)?'':d.k; dueOnly=false;
      document.getElementById('fChan').value=state.chan;
      syncTiles(); syncGroupTiles(); render();
    });
    host.appendChild(b);
    countUp(b.querySelector('.tnum'), n, 70+idx*55);
  });
  syncTiles();
}
function syncTiles(){
  var bs=document.querySelectorAll('#tiles .tile');
  for(var i=0;i<bs.length;i++){
    bs[i].setAttribute('aria-pressed', String(TILEDEF[i].k==='fax'? !!state.fax : state.chan===TILEDEF[i].k));
    var num=bs[i].querySelector('.tnum'), n=countBy(TILEDEF[i].k);

function computeGroupKey(o){
  if(isInNetworkOrg(o)) return 'in-network';

  if(src.indexOf('accepted')>=0) return 'tracked';

function countUp(el,target,delay){
  if(REDUCED){ el.textContent=target; return; }
  if(G){
    var o={v:0};
    el.textContent=target;
    G.to(o,{v:target,duration:1.05,delay:delay/1000,ease:'power3.out',
      onUpdate:function(){ el.textContent=Math.round(o.v); },
      onComplete:function(){ el.textContent=target; }});
    return;
  }
  var dur=780, t0=null;
  setTimeout(function(){
    requestAnimationFrame(function step(ts){
      if(t0===null) t0=ts;
      var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e);
      if(p<1) requestAnimationFrame(step); else el.textContent=target;
    });
  }, delay);
}

   here and the percentage is of the organizations outreach applies to. */
function renderProgress(){
  var tally={}, done=0, i;
  STATUS.forEach(function(s){tally[s.k]=0;});
  for(i=0;i<ORGS.length;i++){ var k=statOf(ORGS[i]); tally[k]=(tally[k]||0)+1; if(k!=='new'&&k!=='contracted') done++; }
  var base=Math.max(1,ORGS.length-(tally.contracted||0));
  var bar=document.getElementById('bar'); bar.innerHTML='';
  STATUS.forEach(function(s){
    if(s.k==='new'||s.k==='contracted'||!tally[s.k]) return;
    var seg=document.createElement('i');
    seg.style.background=s.c; seg.style.width=(tally[s.k]/base*100)+'%';
    seg.title=s.lab+': '+tally[s.k];

  });

    ? done+' of '+base+' worked  ·  '+Math.round(done/base*100)+'%  ·  accepted insurances not counted'
    : 'Nothing logged yet — open an organization to set its status';
  var lg=document.getElementById('legend'); lg.innerHTML='';
  STATUS.forEach(function(s){

    sp.innerHTML='<i class="dot" style="background:'+s.c+'"></i>'+esc(s.lab)+' '+(tally[s.k]||0);

}

/* ---------- list ---------- */
function match(o){
  if(dueOnly && !o._due) return false;
  if(state.fax && !o.fx) return false;
  if(state.grp && groupKey(o)!==state.grp) return false;
  if(state.chan && o.ch!==state.chan) return false;
  if(state.type && (o.t||'Unclassified')!==state.type) return false;
  if(state.stat && statOf(o)!==state.stat) return false;
  if(state.q){
    if((o._search||'').indexOf(state.q)<0) return false;
  }
  return true;
}

function renderPageControls(id, page, total, onChange){
  var host=document.getElementById(id);

  var pages=Math.max(1,Math.ceil(total/PAGE_SIZE));

  host.innerHTML='<button class="btn sm" data-page="prev"'+(page===1?' disabled':'')+'>Previous</button>'+
    '<span class="pager-label">Page '+page+' of '+pages+'</span>'+
    '<button class="btn sm" data-page="next"'+(page===pages?' disabled':'')+'>Next</button>';
  host.querySelector('[data-page="prev"]').addEventListener('click',function(){if(page>1) onChange(page-1);});
  host.querySelector('[data-page="next"]').addEventListener('click',function(){if(page<pages) onChange(page+1);});

/* ---------- follow-up reminders: due within the next 3 days, or overdue (open work only) ---------- */
var DUE_DAYS=3, dueOnly=false, dueToastShown=false;
function dueLabel(days){ return days<0? Math.abs(days)+(days===-1?' day':' days')+' overdue' : days===0? 'today' : days===1? 'tomorrow' : 'in '+days+' days'; }
function renderDueBar(){
  var bar=document.getElementById('dueBar'); if(!bar) return;
  var t=new Date(); t.setHours(0,0,0,0);
  var list=[], next=null;
  for(var i=0;i<ORGS.length;i++){
    var o=ORGS[i]; o._due=false;
    if(!o.followUpDate) continue;
    var s=statOf(o); if(s==='contracted'||s==='declined'||s==='covered'||s==='invalid') continue;
    var d=new Date(o.followUpDate+'T00:00:00'); if(isNaN(d)) continue;
    var days=Math.round((d-t)/864e5);
    if(days>DUE_DAYS){ if(!next||days<next.days) next={o:o,days:days,d:d}; continue; }
    o._due=true; list.push({o:o,days:days});
  }
  list.sort(function(a,b){return a.days-b.days;});
  var BELL='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>';
  if(!list.length){          /* always visible, so people know reminders exist and what is coming next */
    if(dueOnly){ dueOnly=false; }
    bar.hidden=!ORGS.length; bar.classList.add('calm');
    bar.innerHTML=BELL+'<span>No follow-ups due in the next '+DUE_DAYS+' days.</span>'+
      (next? '<span class="count">Next: </span><button type="button" class="dueChip" data-open="'+esc(next.o.i)+'">'+esc(next.o.n)+' · '+
        next.d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</button>' : '<span class="count">No follow-up dates set yet.</span>');
    return;
  }
  bar.classList.remove('calm');
  var over=list.filter(function(x){return x.days<0;}).length;
  bar.hidden=false;
  bar.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'+
    '<b>'+list.length+' follow-up'+(list.length>1?'s':'')+' due</b><span class="count">'+(over?'<span class="over">'+over+' overdue</span> · ':'')+'within '+DUE_DAYS+' days</span>'+
    list.slice(0,4).map(function(x){ return '<button type="button" class="dueChip'+(x.days<0?' over':'')+'" data-open="'+esc(x.o.i)+'">'+esc(x.o.n)+' · '+dueLabel(x.days)+'</button>'; }).join('')+
    (list.length>4?'<span class="count">+'+(list.length-4)+' more</span>':'')+
    '<button type="button" class="btn sm" id="dueShow">'+(dueOnly?'Show all':'Show them')+'</button>';
  if(!dueToastShown){ dueToastShown=true; toast(list.length+' follow-up'+(list.length>1?'s':'')+' due within '+DUE_DAYS+' days'); }
}

/* Files go up as the raw request body (not base64 JSON): the Worker just copies the bytes into KV. */
var MAX_UPLOAD=20*1024*1024;
function uploadRaw(folder, blob, name){
  return api('/api/upload/'+encodeURIComponent(folder)+'?name='+encodeURIComponent(name),
    {method:'POST', headers:{'Content-Type':blob.type||'application/octet-stream'}, body:blob});
}
/* Provider photos are shrunk in the browser (longest side 480px, JPEG) so each is ~30-60 KB in storage. */
function shrinkImage(file, max){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ b?resolve(b):reject(new Error('Could not read this image')); },'image/jpeg',0.86);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('Could not read this image')); };
    img.src=url;
  });
}

/* ===================== AUDIT ===================== */
/* which page of the workspace an audit entry belongs to */
/* every workspace tab, in tab order, and the audit entities each one writes */
var AUDIT_TABS=[['tabDir','Directory',['lead','leads','attachment','notification','notifications']],['tabDash','Dashboard',[]],['tabProv','Providers',['provider','providers']],
  ['tabTraining','Training',['training']],['tabHiring','Hiring',['hiring']],['tabTasks','Tasks',['task','tasks']],['tabSignoff','Daily Sign-off',[]],
  ['tabInsDir','Insurance Directory',['insdir']],['tabAudit','Audit',[]],['tabUsers','Users',['user','users']]];
function auditTabLabel(t){ var el=document.getElementById(t[0]); return (el&&el.textContent.trim())||t[1]; }
function auditPageOf(a){
  var e=String(a.entity||'');
  if(/\(sign-off\)$/.test(e) || e==='Daily Sign-off task types') return auditTabLabel(AUDIT_TABS[6]);
  for(var i=0;i<AUDIT_TABS.length;i++) if(AUDIT_TABS[i][2].indexOf(e)>=0) return auditTabLabel(AUDIT_TABS[i]);
  return e||'Other';
}
function auditPageMatch(a,v){ if(!v) return true; return v.indexOf('so:')===0? a.entity===v.slice(3) : auditPageOf(a)===v.slice(5); }
function renderAudit(){
  var range=document.getElementById('auditRange').value;
  var from,to,today=new Date();
  if(range==='today'){ from=new Date(today.toDateString()); to=new Date(today.getTime()+86400000); }
  else if(range==='month'){ from=new Date(today.getFullYear(),today.getMonth(),1); to=new Date(today.getFullYear(),today.getMonth()+1,1); }
  else if(range==='all'){ from=null; to=null; }
  else { from=document.getElementById('auditFrom').value?new Date(document.getElementById('auditFrom').value):null;
         to=document.getElementById('auditTo').value?new Date(document.getElementById('auditTo').value+'T23:59:59'):null; }
  /* person filter: everyone who appears in the log, plus current accounts */
  var us=document.getElementById('auditUser'), cur=us.value, names={};
  AUDIT.forEach(function(a){ if(a.user) names[a.user]=(names[a.user]||0)+1; });
  (USERS||[]).forEach(function(u){ if(u.name && !(u.name in names)) names[u.name]=0; });
  us.innerHTML='<option value="">Everyone</option>'+Object.keys(names).sort(function(a,b){return a.localeCompare(b);}).map(function(n){
    return '<option value="'+esc(n)+'"'+(n===cur?' selected':'')+'>'+esc(n)+' ('+names[n]+')</option>';}).join('');
  var who=us.value;
  var base=AUDIT.filter(function(a){
    var t=new Date(a.timestamp);
    if(from && t<from) return false; if(to && t>to) return false;
    if(who && a.user!==who) return false;
    return true;
  });
  /* page filter: pages (and each sign-off task) with how many entries this person has there in the chosen dates */
  var ps=document.getElementById('auditPage'), pv=ps.value, pc={}, sc={};
  base.forEach(function(a){ var pg=auditPageOf(a); pc[pg]=(pc[pg]||0)+1; if(pg===auditTabLabel(AUDIT_TABS[6])) sc[a.entity]=(sc[a.entity]||0)+1; });
  var opts='<option value="">All pages ('+base.length+')</option>', listed={};
  AUDIT_TABS.forEach(function(t){ var el=document.getElementById(t[0]), lab=auditTabLabel(t); if(!el && !pc[lab]) return; pc[lab]=pc[lab]||0; });
  var order=AUDIT_TABS.map(auditTabLabel).filter(function(l){ return l in pc; }).concat(Object.keys(pc).filter(function(l){ return AUDIT_TABS.map(auditTabLabel).indexOf(l)<0; }).sort());
  order.forEach(function(pg){
    opts+='<option value="page:'+esc(pg)+'">'+esc(pg)+' ('+pc[pg]+')</option>';
    if(pg===auditTabLabel(AUDIT_TABS[6])) Object.keys(sc).sort().forEach(function(e){ opts+='<option value="so:'+esc(e)+'">  • '+esc(e.replace(/ \(sign-off\)$/,''))+' ('+sc[e]+')</option>'; });
  });
  if(pv && !base.some(function(a){ return auditPageMatch(a,pv); })) opts+='<option value="'+esc(pv)+'">'+esc(pv.replace(/^(page|so):/,''))+' (0)</option>';
  ps.innerHTML=opts; ps.value=pv;
  var rows=base.filter(function(a){ return auditPageMatch(a,pv); }).sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);});
  AUDIT_SHOWN=rows;
  document.getElementById('auditCount').textContent=rows.length+' events'+(who?' by '+who:'')+(pv?' on '+pv.replace(/^(page|so):/,''):'');
  document.getElementById('auditTable').innerHTML='<thead><tr><th>When</th><th>User</th><th>Entity</th><th>Action</th><th>Summary</th></tr></thead><tbody>'+
    rows.map(function(a){return '<tr><td>'+esc((a.timestamp||'').replace('T',' ').slice(0,16))+'</td><td>'+esc(a.user)+'</td>'+
      '<td>'+esc(a.entity)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.summary)+'</td></tr>';}).join('')+'</tbody>';
}

/* ===================== LOGIN RAIN (canvas) ===================== */
var rain=null;
function startRain(){
  var cv=document.getElementById('loginRain');
  if(!cv||rain||REDUCED||!cv.getContext) return;
  var ctx=cv.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,2), W=0, H=0, drops=[], splashes=[], col='#3FD3A8', last=0, wind=-0.17;
  function readColors(){ col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#3FD3A8'; }
  function mk(anyY){ var z=Math.random(); return {x:Math.random()*(W+240)-40, y:anyY?Math.random()*H:-30-Math.random()*H*.35, z:z, len:9+z*20, v:(3.2+z*8.5), ground:H*(.7+Math.random()*.3)}; }
  function size(){
    W=innerWidth; H=innerHeight; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.max(80,Math.min(260,Math.round(W*H/6200)));
    drops=[]; for(var i=0;i<n;i++) drops.push(mk(true));
  }
  function frame(t){
    rain.raf=requestAnimationFrame(frame);
    if(document.hidden){ last=0; return; }
    var dt=last? Math.min(48,t-last)/16.67 : 1; last=t;
    ctx.clearRect(0,0,W,H); ctx.lineCap='round'; ctx.strokeStyle=col;
    for(var layer=0;layer<3;layer++){            /* three depth layers, one stroke call each */
      var lo=layer/3, hi=(layer+1)/3; ctx.beginPath();
      for(var i=0;i<drops.length;i++){
        var d=drops[i]; if(d.z<lo||d.z>=hi) continue;
        d.y+=d.v*dt; d.x+=d.v*wind*dt;
        if(d.y>d.ground){
          if(d.z>.5&&splashes.length<80) splashes.push({x:d.x,y:d.ground,r:.6,a:.22+.28*d.z,z:d.z});
          drops[i]=mk(false); continue;
        }
        ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-d.len*wind,d.y-d.len);
      }
      ctx.globalAlpha=.11+layer*.13; ctx.lineWidth=.75+layer*.55; ctx.stroke();
    }
    ctx.lineWidth=1;
    for(var j=splashes.length-1;j>=0;j--){
      var s=splashes[j]; s.r+=.55*dt*(.6+s.z); s.a-=.011*dt;
      if(s.a<=0){ splashes.splice(j,1); continue; }
      ctx.globalAlpha=s.a; ctx.beginPath(); ctx.ellipse(s.x,s.y,s.r*2.4,s.r*.55,0,0,Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  readColors(); size();
  rain={raf:0,resize:size,readColors:readColors};
  rain.raf=requestAnimationFrame(frame);
  addEventListener('resize',size);
}
function stopRain(){
  if(!rain) return;
  cancelAnimationFrame(rain.raf); removeEventListener('resize',rain.resize); rain=null;
  var cv=document.getElementById('loginRain'); if(cv){ cv.width=0; cv.height=0; }
}
themeSelect.addEventListener('change',function(){ if(rain) rain.readColors(); });

/* ===================== HIRING (the "Hiring Process" workbook) =====================
   17-step checklist per candidate; stage, completion %, next step and action alert are derived from it.
   Interview + new-hire training bookings follow Anna's availability rules from the workbook. */
var HIRE_STEPS=[
  ['Sourcing','Receive Candidate CVs','1 business day','CV saved and candidate row created'],
  ['Screening','Review CVs','2 business days','Minimum qualifications reviewed'],
  ['Compliance','Verify License + DEA','3 business days','Active license and DEA confirmed'],
  ['Clinical','Clinical Review','3 business days','Clinical approval documented'],
  ['Interview','Schedule Interview','2 business days','Interview date agreed'],
  ['Interview','Send Zoom Invite','Same day','Invite sent to all attendees'],
  ['Interview','Coordinate Schedule','1 business day','Panel and candidate availability confirmed'],
  ['Decision','Post-Interview Decision','2 business days','Decision recorded'],
  ['Offer','Send Offer Letter','2 business days','Offer issued'],
  ['Onboarding','Onboarding & Credentialing','Per payer timeline','Onboarding and credentialing initiated'],
  ['Setup','Website Information & Software Setup','5 business days','Profile and software configured'],
  ['Training','Schedule Training','3 business days','Training calendar confirmed'],
  ['Setup','Microsoft Teams Setup','2 business days','Account and channels available'],
  ['Training','Send Training Invites','Same day','Invites sent'],
  ['Enrollment','Send PECOS/NPPES Surrogacy Request','2 business days','Surrogacy request submitted'],
  ['Launch','Finalize Start Date & IT Access','3 business days','Start date and access confirmed'],
  ['Launch','Announce Hire','Start date','Organization announcement sent']
];
var HIRE_STAGES=['New','In Review','Interviewing','Offer Pending','Onboarding','Ready to Start'];
var BOOK_NOTES=['Not Scheduled','Scheduled and Link Sent','Sent and Software and MA informed','Software informed'];
var hireTab='pipeline', hireQ='', hireStage='';
function dKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return dKey(new Date()); }
function parseKey(k){ return new Date(k+'T00:00:00'); }
function dayDiff(a,b){ return Math.round((parseKey(b)-parseKey(a))/864e5); }
function addDays(k,n){ var d=parseKey(k); d.setDate(d.getDate()+n); return dKey(d); }
function fmtD(k){ if(!k) return ''; var d=parseKey(k); return isNaN(d)?k:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function hmToMin(t){ var m=/^(\d{1,2}):(\d{2})/.exec(t||''); return m? (+m[1])*60+(+m[2]) : NaN; }
function minToLabel(m){ var h=Math.floor(m/60), mm=m%60, ap=h>=12?'PM':'AM'; return ((h+11)%12+1)+':'+String(mm).padStart(2,'0')+' '+ap; }
function hSteps(c){ var s=c.steps||[], n=0; for(var i=0;i<17;i++) if(s[i]) n++; return n; }
function hStage(c){ if(c.hold) return c.hold; var n=hSteps(c); return n===0?'New':n<=3?'In Review':n<=7?'Interviewing':n===8?'Offer Pending':n<=15?'Onboarding':n===16?'Ready to Start':'Complete'; }
function hNext(c){ var s=c.steps||[]; for(var i=0;i<17;i++) if(!s[i]) return HIRE_STEPS[i][1]; return 'Complete'; }
function hAction(c){ if(hSteps(c)===17) return 'Complete'; if(c.hold) return c.hold; if(!c.nextDue) return 'Set due date'; var dd=dayDiff(todayKey(),c.nextDue); return dd<0?'Overdue':dd<=7?'Due soon':'On track'; }
var ACT_C={'Overdue':'var(--ch-none)','Due soon':'var(--ch-form)','On track':'var(--ch-email)','Complete':'var(--ch-email)','Set due date':'var(--muted)','On Hold':'var(--muted)','Rejected':'var(--ch-none)','Withdrawn':'var(--muted)'};
function pillHTML(txt){ return '<span class="hpill" style="--pc:'+(ACT_C[txt]||'var(--accent)')+'">'+esc(txt)+'</span>'; }
function candidates(){ return HIRING.filter(function(x){return x.kind==='candidate' && !x.deleted;}); }
function activeCands(){ return candidates().filter(function(c){ return hSteps(c)<17 && c.hold!=='Rejected' && c.hold!=='Withdrawn'; }); }
function hiredList(){
  var out=candidates().filter(function(c){return hSteps(c)===17;}).map(function(c){ return {name:c.name, specialty:c.specialty, hired:c.expectedStart, cvDate:c.cvDate, src:c}; });
  HIRING.forEach(function(x){ if(x.kind==='hired' && !x.deleted) out.push({name:x.name, specialty:x.specialty, hired:x.hired, cvDate:x.cvDate}); });
  return out.sort(function(a,b){ return String(b.hired).localeCompare(String(a.hired)); });
}
function bookings(kind){ return HIRING.filter(function(x){return x.kind===kind && !x.deleted;}); }
function trainingDays(b){ return b.date2 ? [b.date, b.date2] : [b.date]; }   /* first day + optional second day */
/* Anna: Mon-Thu; interviews 40 min, start every 20 min 9:00-12:20 and 2:00-5:20 (lunch 1-2); trainings = one day + optional second day, Mon-Thu */
function interviewCheck(b, ignoreId){
  if(!b.name) return 'Candidate missing'; if(!b.date) return 'Date missing'; if(!b.start) return 'Start time missing';
  var wd=parseKey(b.date).getDay(); if(wd<1||wd>4) return 'Anna works Monday–Thursday';
  var m=hmToMin(b.start); if(!((m>=540&&m<=740)||(m>=840&&m<=1040)) || (m-540)%20!==0) return 'Not an interview slot (9:00–12:20 or 2:00–5:20, every 20 min)';
  for(var i=0,iv=bookings('interview');i<iv.length;i++){ var o=iv[i]; if(o.id===ignoreId||o.date!==b.date) continue; var om=hmToMin(o.start); if(Math.abs(om-m)<40) return 'Overlaps '+o.name+' at '+minToLabel(om); }
  for(var j=0,tr=bookings('training');j<tr.length;j++){ if(trainingDays(tr[j]).indexOf(b.date)>=0) return 'Anna is training '+tr[j].name+' that day'; }
  return 'OK';
}
function trainingCheck(b, ignoreId){
  if(!b.name) return 'Trainee missing'; if(!b.date) return 'Start date missing';
  var wd=parseKey(b.date).getDay(); if(wd<1||wd>4) return 'Training must be on a Monday–Thursday';
  if(b.date2){ if(b.date2<=b.date) return 'The second training day must be after the first'; var w2=parseKey(b.date2).getDay(); if(w2<1||w2>4) return 'The second training day must be a Monday–Thursday'; }
  var days=trainingDays(b);   /* group training is allowed (same as the workbook); only interviews block a training day */
  for(var i=0,iv=bookings('interview');i<iv.length;i++){ if(days.indexOf(iv[i].date)>=0) return 'Anna has an interview with '+iv[i].name+' that day'; }

/* ===================== TASKS (the "Task Delegation" workbook) =====================
   One task per row; deadline = task date + 3 working days; completed tasks stay in the Closed archive. */
var TASK_PRI=['1 - Mandatory','2 - Very Important','3 - Important','4 - Standard'];
var PRI_C={'1 - Mandatory':'var(--ch-none)','2 - Very Important':'var(--ch-form)','3 - Important':'var(--ch-phone)','4 - Standard':'var(--muted)'};
var TEAM=[];   /* active app users (names + roles) from /api/team -- who tasks can be assigned to */
var taskTab='open', taskWho='', taskPri='', monQ='', monAgent='';
function agentTasks(a){ return taskList().filter(function(t){return t.assignee===a;}).sort(function(x,y){ return String(y.date).localeCompare(String(x.date)); }); }
function agentActivity(a){ return (AUDIT||[]).filter(function(e){return e.user===a;}).sort(function(x,y){ return String(y.timestamp).localeCompare(String(x.timestamp)); }); }
function taskOnTime(t){ if(!t.completed) return taskState(t)==='Overdue'?'Late':'—'; return (!t.deadline||!t.completedAt||t.completedAt<=t.deadline)?'On time':'Late'; }
function exportAgentTasks(a){
  var names=a?[a]:agentNames();
  withXLSX(function(XLSX){
    var tasks=[], acts=[];
    names.forEach(function(n){
      agentTasks(n).forEach(function(t){ tasks.push({Agent:n,Task:t.task,Priority:t.priority||'','Task date':t.date||'',Deadline:t.deadline||'',Status:taskState(t),'Completed on':t.completedAt||'','On time?':taskOnTime(t),'TL note':t.tlNote||'','Agent note':t.agentNote||''}); });
      agentActivity(n).forEach(function(e){ acts.push({Agent:n,When:(e.timestamp||'').replace('T',' ').slice(0,19),Area:e.entity,Action:e.action,'What changed':e.summary}); });
    });
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tasks.length?tasks:[{Agent:'',Task:'No tasks'}]),'Tasks');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(acts.length?acts:[{Agent:'',When:'No activity'}]),'Activity');
    XLSX.writeFile(wb,(a?a.replace(/[^\w]+/g,'-'):'all-agents')+'-tasks-'+todayKey()+'.xlsx');
  });
}
function addWorkdays(k,n){ var d=parseKey(k); while(n>0){ d.setDate(d.getDate()+1); var w=d.getDay(); if(w!==0&&w!==6) n--; } return dKey(d); }
function taskList(){ return TASKS.filter(function(t){return !t.deleted;}); }
function taskState(t){ if(t.completed) return 'Closed'; var td=todayKey(); if(t.deadline && t.deadline<td) return 'Overdue'; if(t.deadline && t.deadline<=addWorkdays(td,3)) return 'Due soon'; return 'On track'; }
/* Tasks are assigned to agents (User role) by team leaders (Admin / Super admin); agents see and close their own. */
function teamNames(){ return TEAM.filter(function(u){return u.role==='user';}).map(function(u){return u.name;}).filter(Boolean).sort(function(a,b){return a.localeCompare(b);}); }
function isLeader(){ return isAdminLikeMe(); }
function visibleTasks(){ var all=taskList(); return isLeader()? all : all.filter(function(t){ return ME && t.assignee===ME.name; }); }
function agentNames(){ var s={}; teamNames().forEach(function(a){s[a]=1;}); taskList().forEach(function(t){ if(t.assignee) s[t.assignee]=1; }); return Object.keys(s).sort(function(a,b){return a.localeCompare(b);}); }
function isAgent(n){ return TEAM.some(function(u){ return u.name===n && u.role==='user'; }); }

document.getElementById('tasksView').addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-ttab],[data-done],[data-task],[data-agent],#addTask,#tExport,#tMonClose'); if(!t) return;
  if(t.dataset.ttab){ taskTab=t.dataset.ttab; renderTasks(); return; }
  if(t.id==='tExport') return exportAgentTasks(monAgent);
  if(t.id==='tMonClose'){ monAgent=''; renderTasks(); return; }
  if(t.dataset.agent!=null){ monAgent= monAgent===t.dataset.agent ? '' : t.dataset.agent; renderTasks(); return; }
  if(t.id==='addTask') return openTaskModal(null);
  if(t.dataset.done){ var d=TASKS.filter(function(x){return x.id===t.dataset.done;})[0]; if(!d) return;
    apiSave('tasks',{id:d.id,completed:true,completedAt:todayKey()},'update').then(function(){ d.completed=true; d.completedAt=todayKey(); renderTasks(); toast('Task closed and archived'); }).catch(function(er){ toast(er.message); }); return; }
  if(t.dataset.task){ var x=TASKS.filter(function(y){return y.id===t.dataset.task;})[0]; if(x) openTaskModal(x); }
});
document.getElementById('tasksView').addEventListener('input',function(e){

});
document.getElementById('tasksView').addEventListener('change',function(e){ if(e.target.id==='tWho'){ taskWho=e.target.value; renderTasks(); } if(e.target.id==='tPri'){ taskPri=e.target.value; renderTasks(); } });
function openTaskModal(t){
  if(!isLeader()) return openAgentTaskModal(t);
  var isNew=!t, x=t||{task:'',date:todayKey(),assignee:'',priority:'4 - Standard',tlNote:'',agentNote:'',completed:false};
  document.getElementById('modalHost').innerHTML='<div class="modalScrim" id="mScrim"><div class="modal"><h3>'+(isNew?'Add task':(x.completed?'Closed task':'Edit task'))+'</h3>'+
    '<div class="frow"><label for="tk_task">Task *</label><textarea id="tk_task" rows="2">'+esc(x.task)+'</textarea></div>'+
    '<div class="frow"><label for="tk_who">Assigned to *</label><select id="tk_who"><option value="">Choose a team member</option>'+
      teamNames().concat(x.assignee && teamNames().indexOf(x.assignee)<0 ? [x.assignee] : []).map(function(a){return '<option'+(x.assignee===a?' selected':'')+'>'+esc(a)+'</option>';}).join('')+'</select></div>'+
    '<div class="frow"><label for="tk_pri">Priority</label><select id="tk_pri">'+TASK_PRI.map(function(p){return '<option'+(x.priority===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select></div>'+
    '<div class="frow"><label for="tk_date">Task date</label><input id="tk_date" type="date" value="'+esc(x.date||todayKey())+'"></div>'+
    '<div class="frow"><label for="tk_due">Deadline</label><input id="tk_due" type="date" value="'+esc(x.deadline||addWorkdays(x.date||todayKey(),3))+'">'+
      '<span class="row" style="gap:6px;margin-top:6px"><button class="btn sm" type="button" data-due="0">Same day</button><button class="btn sm" type="button" data-due="1">Next working day</button><button class="btn sm" type="button" data-due="3">3 working days</button></span></div>'+
    '<div class="frow"><label for="tk_tl">TL note</label><textarea id="tk_tl" rows="2">'+esc(x.tlNote||'')+'</textarea></div>'+
    '<div class="frow"><label for="tk_ag">Agent note</label><textarea id="tk_ag" rows="2">'+esc(x.agentNote||'')+'</textarea></div>'+
    '<div class="frow" id="mErr" style="display:none"><span class="err"></span></div>'+
    '<div class="row"><button class="btn pri" id="mSave">Save</button><button class="btn" id="mCancel">Cancel</button>'+
      (!isNew&&x.completed?'<button class="btn" id="tkReopen">Reopen</button>':'')+(isNew?'':'<button class="btn" id="mDel" style="margin-left:auto">Delete</button>')+'</div></div></div>';
  var due=document.getElementById('tk_due'), dueSet=isNew?false:true;   /* a new task's deadline follows its date until changed */
  due.addEventListener('change',function(){ dueSet=true; });
  document.getElementById('tk_date').addEventListener('change',function(){ if(!dueSet && this.value) due.value=addWorkdays(this.value,3); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-due]'),function(b){ b.addEventListener('click',function(){
    var d=document.getElementById('tk_date').value||todayKey(), n=+b.dataset.due; due.value= n? addWorkdays(d,n) : d; dueSet=true; }); });
  document.getElementById('mCancel').addEventListener('click',closeModal);
  document.getElementById('mScrim').addEventListener('click',function(e){ if(e.target.id==='mScrim') closeModal(); });
  var persist=function(rec){ return apiSave('tasks',rec,isNew?'create':'update').then(function(resp){ if(isNew){ rec.id=resp.id; TASKS.push(rec);} else Object.assign(t,rec); closeModal(); renderTasks(); toast('Saved'); }); };
  if(!isNew) document.getElementById('mDel').addEventListener('click',function(){ if(!confirm('Delete this task?')) return; apiSave('tasks',{id:t.id},'delete').then(function(){ t.deleted=true; closeModal(); renderTasks(); }).catch(function(e){toast(e.message);}); });
  var re=document.getElementById('tkReopen'); if(re) re.addEventListener('click',function(){ apiSave('tasks',{id:t.id,completed:false,completedAt:''},'update').then(function(){ t.completed=false; t.completedAt=''; closeModal(); renderTasks(); toast('Task reopened'); }); });
  document.getElementById('mSave').addEventListener('click',function(){
    var g=function(id){return document.getElementById(id).value.trim();}, d=g('tk_date')||todayKey(), dd=g('tk_due')||addWorkdays(d,3);
    if(dd<d){ var er0=document.getElementById('mErr'); er0.style.display='block'; er0.querySelector('.err').textContent='The deadline cannot be before the task date.'; return; }
    var rec={id:x.id||'',task:g('tk_task'),assignee:g('tk_who'),priority:g('tk_pri'),date:d,deadline:dd,tlNote:g('tk_tl'),agentNote:g('tk_ag'),completed:!!x.completed,completedAt:x.completedAt||''};
    if(!rec.task||!rec.assignee){ var er=document.getElementById('mErr'); er.style.display='block'; er.querySelector('.err').textContent='Task and Assigned to are required.'; return; }
    persist(rec).catch(function(e){ var er=document.getElementById('mErr'); er.style.display='block'; er.querySelector('.err').textContent=e.message; });
  });
}

function openAgentTaskModal(t){
  if(!t) return;
  var ro=function(lab,val){ return '<div class="fgroup"><span class="flab">'+lab+'</span><div class="fval">'+esc(val||'—')+'</div></div>'; };
  document.getElementById('modalHost').innerHTML='<div class="modalScrim" id="mScrim"><div class="modal"><h3>'+esc(t.task)+'</h3>'+
    ro('Priority',t.priority)+ro('Task date',fmtD(t.date))+ro('Deadline',fmtD(t.deadline)+' · '+taskState(t))+ro('TL note (from your team leader)',t.tlNote)+
    '<div class="frow"><label for="tk_ag">Agent note</label><textarea id="tk_ag" rows="3">'+esc(t.agentNote||'')+'</textarea></div>'+
    '<div class="frow" id="mErr" style="display:none"><span class="err"></span></div>'+
    '<div class="row"><button class="btn pri" id="mSave">Save note</button>'+(t.completed?'':'<button class="btn" id="tkDone">✓ Mark done</button>')+'<button class="btn" id="mCancel">Close</button></div></div></div>';
  document.getElementById('mCancel').addEventListener('click',closeModal);
  document.getElementById('mScrim').addEventListener('click',function(e){ if(e.target.id==='mScrim') closeModal(); });
  var send=function(patch,msg){ apiSave('tasks',Object.assign({id:t.id},patch),'update').then(function(){ Object.assign(t,patch); closeModal(); renderTasks(); toast(msg); })
    .catch(function(e){ var er=document.getElementById('mErr'); er.style.display='block'; er.querySelector('.err').textContent=e.message; }); };
  document.getElementById('mSave').addEventListener('click',function(){ send({agentNote:document.getElementById('tk_ag').value.trim()},'Note saved'); });
  var d=document.getElementById('tkDone'); if(d) d.addEventListener('click',function(){ send({agentNote:document.getElementById('tk_ag').value.trim(),completed:true,completedAt:todayKey()},'Task closed and archived'); });
}
