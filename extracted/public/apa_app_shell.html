var SO={date:'', today:'', entries:[], custom:[], hideEmpty:false, open:{}, view:'board', dmode:'day', dday:'', dmonth:'', stats:{}, statsBusy:'', edit:null, chain:Promise.resolve()};
var SO_AV=['#3FD3A8','#7CB2E0','#E3AE4C','#E89078','#B49CF0','#5FC4E8','#9BD46A','#F08FB8'];
function soAll(){ return SO_TASKS.concat(SO.custom.map(function(c){ return [c.k, c.label, c.q||'', c.label, c.deleted]; })); }
/* the standard types + leader-added ones; a removed type still shows on days that have something for it */
function soTaskList(){ var used={}; SO.entries.forEach(function(e){ used[e.task]=1; }); return soAll().filter(function(t){ return !t[4] || used[t[0]]; }); }
function soTask(k){ var L=soAll(); for(var i=0;i<L.length;i++) if(L[i][0]===k) return L[i]; return [k,k]; }
function soLabel(k){ return soTask(k)[1]; }
function soNotes(e){ if(!e) return []; if(e.notes) return e.notes; return e.note? [{id:'n0', text:e.note, at:e.at, by:e.by||e.agent}] : []; }
function soHas(e){ return !!e && e.count!=null && e.count!==''; }
function soFirst(t){ return String(t||'').split('\n')[0]; }
function soWhen(at){ return at? new Date(at).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : ''; }
function soInit(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
function soColor(n){ var h=0; for(var i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return SO_AV[h%SO_AV.length]; }
function soShift(d,n){ var p=d.split('-'); return dKey(new Date(+p[0],+p[1]-1,+p[2]+n)); }
function soFmt(d){ var p=d.split('-'); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'}); }
function soFmtM(m){ var p=m.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString([], {month:'long', year:'numeric'}); }
function soMap(){ var m={}; SO.entries.forEach(function(e){ m[e.agent+'|'+e.task]=e; }); return m; }
function soAgents(){
  if(!isLeader()) return ME? [{name:ME.name, role:ME.role}] : [];
  var seen={}, out=[];
  TEAM.filter(function(u){ return u.role==='user'; }).forEach(function(u){ if(!seen[u.name]){ seen[u.name]=1; out.push(u); } });
  SO.entries.forEach(function(e){ if(!seen[e.agent]){ seen[e.agent]=1; out.push({name:e.agent, role:'user'}); } });
  return out.sort(function(a,b){ return a.name.localeCompare(b.name); });

function soReport(){
  var m=soMap(), agents=soAgents(), lines=['DAILY SIGN-OFF · '+soFmt(SO.date),''], rows=[], idle=[];

    var parts=[], n=0;

      parts.push('  '+t[1]+(hc?' · '+e.count+' done':'')+(N.length?' ('+N.length+' '+(N.length===1?'note':'notes')+')':''));
      N.forEach(function(x){ parts.push('    • '+String(x.text).split('\n').join('\n      ')); });
      if(N.length) N.forEach(function(x,i){ rows.push({Date:SO.date, Agent:a.name, Task:t[1], Number:i===0&&hc?e.count:'', '#':i+1, Note:x.text}); });
      else rows.push({Date:SO.date, Agent:a.name, Task:t[1], Number:e.count, '#':'', Note:''}); });
    if(!n){ idle.push(a.name); return; }

function idCount(f){ return INSDIR.filter(f).length; }
function idBars(title, pairs){ var mx=Math.max.apply(null, pairs.map(function(p){ return p[1]; }).concat([1]));
  return '<div class="id-chart"><div class="id-ct">'+esc(title)+'</div>'+pairs.map(function(p){ return '<div class="id-br"><span class="id-bl" title="'+esc(p[0])+'">'+esc(p[0])+'</span><span class="id-bt"><i style="width:'+(p[1]/mx*100).toFixed(1)+'%"></i></span><b>'+p[1]+'</b></div>'; }).join('')+'</div>'; }
function idTable(head, body){ return '<table class="id-t"><thead><tr>'+head.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr></thead><tbody>'+
  body.map(function(r){ return '<tr>'+r.map(function(c,i){ return '<td'+(i?' class="num"':'')+'>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>'; }

function idDash(){

    '<div class="id-kpis">'+kpi('Total Tasks',tot)+kpi('Active Agents',ag.length)+kpi('Final Results (Latest Update)',fin)+kpi('Completion Rate',(tot?Math.round(fin/tot*100):0)+'%')+'</div>';
  h+=idSection('Workload and Progress by Agent', idTable(['Agent','Total'].concat(ID_STAGES), ag.map(function(a){ return [a, idCount(function(x){ return x.agent===a; })].concat(ID_STAGES.map(function(s){ return idCount(function(x){ return x.agent===a && x.status===s; }); })); })),
    idBars('Assigned Tasks by Agent', ag.map(function(a){ return [a, idCount(function(x){ return x.agent===a; })]; })));
  var st=ID_STAGES.map(function(s){ return [s, idCount(function(x){ return x.status===s; })]; });
  h+=idSection('Tasks by Status', idTable(['Status','Tasks'], st), idBars('Tasks by Workflow Stage', st));
  var cats=ID_CATS.slice(); INSDIR.forEach(function(x){ if(x.cat && cats.indexOf(x.cat)<0) cats.push(x.cat); });

  h+=idSection('Latest Update Status', idTable(['Update Status','Tasks'], up), idBars('Latest Update Status', up));
  h+=idSection('Latest Update by Agent', idTable(['Agent'].concat(ID_UPD,['Not Updated']), ag.map(function(a){ return [a].concat(ID_UPD.map(function(u){ return idCount(function(x){ return x.agent===a && x.upd===u; }); }), [idCount(function(x){ return x.agent===a && !x.upd; })]); })), '');

/* ===================== USERS (admin-only) ===================== */
function renderUsers(){
  apiGet('users').then(function(list){
    USERS=list;
    document.getElementById('usersCount').textContent=list.length+' users';
    document.getElementById('usersTable').innerHTML='<thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody>'+
      list.map(function(u){
        // A plain admin can't touch a super admin's account at all -- not
        // even view an edit form for it -- so no Edit/Delete on that row.
        var canManage = ME.role==='superadmin' || u.role!=='superadmin';
        var actions = canManage
          ? '<button class="btn sm" data-edit="'+esc(u.id)+'">Edit</button> <button class="btn sm" data-del="'+esc(u.id)+'">Delete</button>'
          : '<span class="count">Super admin only</span>';
        return '<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.role)+'</td><td>'+actions+'</td></tr>';
      }).join('')+'</tbody>';
    document.querySelectorAll('#usersTable [data-edit]').forEach(function(el){ el.addEventListener('click',function(){
      openUserModal(USERS.filter(function(x){return x.id===el.dataset.edit;})[0]);
    });});
    document.querySelectorAll('#usersTable [data-del]').forEach(function(el){ el.addEventListener('click',function(){
      if(!confirm('Remove this user? They will no longer be able to sign in.')) return;
      apiSave('users',{id:el.dataset.del},'delete').then(function(){ toast('User removed'); renderUsers(); }).catch(function(e){ toast(e.message); });
    });});
  }).catch(function(e){ document.getElementById('usersTable').innerHTML=''; toast(e.message); });
}
function openUserModal(existing){
  var u=existing||{name:'',email:'',role:'user'};
  var isSelf = existing && ME && String(u.id)===String(ME.uid);
  var canSetPassword = !existing || isSelf || ME.role==='superadmin';
  var host=document.getElementById('modalHost');
  var canGrantSuperAdmin = ME.role==='superadmin';
  var roleOptions = '<option value="user"'+(u.role==='user'?' selected':'')+'>User</option><option value="admin"'+(u.role==='admin'?' selected':'')+'>Admin</option>'+
    '<option value="superadmin"'+(u.role==='superadmin'?' selected':'')+(canGrantSuperAdmin?'':' disabled')+'>Super Admin</option>';
  var roleLocked = u.role==='superadmin' && !canGrantSuperAdmin;
  var passwordField = canSetPassword
    ? '<div class="frow"><label'+(existing?'':' class="req"')+'>'+(existing?'New password (leave blank to keep current)':'Password')+'</label><input id="uPassword" type="password"></div>'
    : '<div class="frow"><span class="count">Only a super admin can reset another admin\'s password.</span></div>';
  host.innerHTML='<div class="modalScrim" id="mScrim"><div class="modal"><h3>'+(existing?'Edit user':'Add user')+'</h3>'+
    '<div class="frow"><label class="req">Name</label><input id="uName" value="'+esc(u.name)+'"></div>'+
    '<div class="frow"><label class="req">Email</label><input id="uEmail" type="email" placeholder="name@advancedpsychiatryassociates.com" value="'+esc(u.email)+'">'+
      '<span class="count">Must be an @advancedpsychiatryassociates.com address.</span></div>'+
    passwordField+
    '<div class="frow"><label>Role</label><select id="uRole"'+(roleLocked?' disabled':'')+'>'+roleOptions+'</select>'+
      (roleLocked?'<span class="count" style="margin-top:4px">Only a super admin can change a super admin\'s role.</span>':'')+'</div>'+
    '<div class="frow" id="mErr" style="display:none"><span class="err"></span></div>'+
    '<div class="row"><button class="btn pri" id="mSave">Save</button><button class="btn" id="mCancel">Cancel</button></div></div></div>';
  document.getElementById('mCancel').addEventListener('click',closeModal);
  document.getElementById('mScrim').addEventListener('click',function(e){ if(e.target.id==='mScrim') closeModal(); });
  document.getElementById('mSave').addEventListener('click',function(){
    var pwEl=document.getElementById('uPassword');
    var rec={id:u.id||'', name:document.getElementById('uName').value.trim(), email:document.getElementById('uEmail').value.trim(),
      role:document.getElementById('uRole').value, password:pwEl?pwEl.value:''};
    if(!rec.name||!rec.email||(!existing&&!rec.password)){
      var e=host.querySelector('#mErr'); e.style.display='block'; e.querySelector('.err').textContent='Name, email, and password are all required.'; return;
    }
    var emailChanged = !existing || rec.email.toLowerCase()!==String(u.email||'').toLowerCase();
    if(emailChanged && !/^[^\s@]+@advancedpsychiatryassociates\.com$/i.test(rec.email)){
      var e2=host.querySelector('#mErr'); e2.style.display='block'; e2.querySelector('.err').textContent='Only @advancedpsychiatryassociates.com email addresses can be used for accounts.'; return;
    }
    if(!rec.password) delete rec.password;
    apiSave('users', rec, existing?'update':'create').then(function(){ closeModal(); renderUsers(); toast('Saved'); })
      .catch(function(e){ var el=host.querySelector('#mErr'); el.style.display='block'; el.querySelector('.err').textContent=e.message; });
  });
}

function showLoginScreen(){
  document.getElementById('appMain').hidden=true;
  document.getElementById('loginScreen').hidden=false;
  document.getElementById('logoutBtn').hidden=true;
  startRain();
}
function loadAppData(){
  var fetches=[
    apiGet('leads'), apiGet('providers'), Promise.resolve([]),   /* notifications bar removed (2026-09-29) */
    (ME.role==='admin'||ME.role==='superadmin'? apiGet('audit') : Promise.resolve([])),
    apiGet('accepted-insurances'), apiGet('training'),
    apiGet('hiring').catch(function(){return [];}), apiGet('tasks').catch(function(){return [];}), api('/api/team').catch(function(){return [];})
  ];
  Promise.allSettled(fetches).then(function(results){
    var failed = results.filter(function(r){ return r.status === 'rejected'; });
    if(failed.length){
      var first = failed[0].reason && failed[0].reason.message ? failed[0].reason.message : 'Unknown error';
      document.getElementById('grid').innerHTML='<div class="empty"><b>Could not load data</b>'+esc(first)+'</div>';
      return;
    }
    var r = results.map(function(item){ return item.value; });
    var leadsRaw = r[0]||[];
    if(leadsRaw && leadsRaw.split){   /* Worker sends the two KV blobs unparsed; merge dynamic over static here */
      var dyn={}; (leadsRaw.d||[]).forEach(function(d){ dyn[String(d.i)]=d; });
      leadsRaw=(leadsRaw.s||[]).map(function(s){ var d=dyn[String(s.i)]; return d? Object.assign({},s,d) : s; });
    }
    ORGS = leadsRaw.filter(function(o){return !o.deleted;}).map(indexOrg);
    PROVIDERS = (r[1]||[]);
    NOTIFS = (r[2]||[]);
    AUDIT = (r[3]||[]);
    ACCEPTED_INSURANCES = r[4]||{};
    TRAINING = r[5]||[];
    HIRING = r[6]||[]; TASKS = r[7]||[]; TEAM = r[8]||[];
    requestAnimationFrame(function(){
      buildGroupTiles(); buildTiles(); buildFilters(); render(); buildMetrics();
    });
  }).catch(function(e){
    document.getElementById('grid').innerHTML='<div class="empty"><b>Could not load data</b>'+esc(e.message)+'</div>';
  });
}
function afterSignIn(name, role, uid){
  ME = {name:name, role:role, uid:uid};
  stopRain();
  document.getElementById('appMain').hidden=false;
  document.getElementById('loginScreen').hidden=true;
  var sync=document.getElementById('sync');
  sync.classList.add('live'); document.getElementById('syncTxt').textContent='signed in as '+ME.name;
  document.getElementById('logoutBtn').hidden=false;
  var isAdminLike = ME.role==='admin'||ME.role==='superadmin';
  document.getElementById('tabAudit').hidden=!isAdminLike;
  document.getElementById('tabUsers').hidden=!isAdminLike;
  loadAppData();
  if(!document.getElementById('xjs')){ var xs=document.createElement('script'); xs.id='xjs'; xs.src='/api/extras.js?v='+Date.now(); document.body.appendChild(xs); }
}
function doLogin(){
  var email=document.getElementById('loginEmail').value.trim();
  var password=document.getElementById('loginPassword').value;
  var errBox=document.getElementById('loginErr'), btn=document.getElementById('loginSubmit');
  if(btn.disabled) return;
  errBox.style.display='none'; btn.disabled=true; btn.style.opacity=.7;
  api('/api/login',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:email,password:password})})
    .then(function(d){ afterSignIn(d.name, d.role, d.uid); })
    .catch(function(e){ errBox.style.display='block'; errBox.querySelector('.err').textContent=e.message; })
    .then(function(){ btn.disabled=false; btn.style.opacity=''; });
}
document.getElementById('loginSubmit').addEventListener('click',doLogin);

  afterSignIn(d.name, d.role, d.uid);
}).catch(function(){ showLoginScreen(); });

/* Page-load sequence. Everything animates FROM a visible resting state and
   clears its inline props afterwards, and a failsafe force-reveals the page
   if anything interrupts the timeline — the page must never sit blank. */
var INTRO='.brand, .lede h1, .tile, .prog, .controls';
function revealAll(){
  var els=document.querySelectorAll(INTRO);
  for(var i=0;i<els.length;i++){
    els[i].style.opacity=''; els[i].style.transform=''; els[i].style.visibility='';
  }
}
if(G && !REDUCED){
  try{
    var tl=G.timeline({defaults:{ease:'power3.out'}, onComplete:revealAll});
    tl.from('.brand',{opacity:0,x:-14,duration:.5,clearProps:'all'})
      .from('.lede h1',{opacity:0,y:18,duration:.55,clearProps:'all'},'-=.3')
      .from('.tile',{opacity:0,y:20,scale:.96,duration:.55,stagger:.07,clearProps:'all'},'-=.3')
      .from('.prog, .controls',{opacity:0,y:14,duration:.45,stagger:.06,clearProps:'all'},'-=.3');
  }catch(e){ revealAll(); }
  setTimeout(revealAll, 2600);
}

})();
</script>
